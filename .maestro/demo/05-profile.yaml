# Scene 5: Profile
appId: com.adoteme.app
---
# Navigate first, so the clip starts on this scene's screen
- tapOn: "Perfil"
- extendedWaitUntil:
    visible: "Meu Perfil"
    timeout: 5000
- runFlow: ../common/start-recording.yaml
- runFlow: ../common/pause.yaml
- swipe:
    start: "50%,75%"
    end: "50%,40%"
    duration: 1800
- runFlow: ../common/pause.yaml
- runFlow: ../common/stop-recording.yaml
