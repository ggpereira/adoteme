# Scene 2: Explore → pet details (favorite, scroll) → back
appId: com.adoteme.app
---
# Navigate first, so the clip starts on this scene's screen
- tapOn: "Explorar"
- extendedWaitUntil:
    visible: "Buscar por nome ou raça"
    timeout: 5000
- runFlow: ../common/start-recording.yaml
- runFlow: ../common/pause.yaml
- tapOn: "Cães"
- runFlow: ../common/pause.yaml
- tapOn:
    text: "Mel"
    index: 0
- runFlow: ../common/pause.yaml
- tapOn: "Favoritar"
- runFlow: ../common/pause.yaml
- swipe:
    start: "50%,75%"
    end: "50%,40%"
    duration: 1500
- runFlow: ../common/pause.yaml
- tapOn: "Voltar"
- runFlow: ../common/stop-recording.yaml
