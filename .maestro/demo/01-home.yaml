# Scene 1: Home. Restarts the app first, so every recording starts from a
# clean state (no favorites, default filter, empty form). Meant for the
# release build: with the dev client, a restart may open the Expo launcher.
appId: com.adoteme.app
---
- launchApp:
    stopApp: true
    # A fresh release install has no location permission yet; without it the
    # Map scene shows the "needs permission" placeholder instead of the map
    permissions:
      location: allow
- extendedWaitUntil:
    visible: "Em destaque"
    timeout: 15000

- runFlow: ../common/start-recording.yaml
- swipe:
    start: "50%,75%"
    end: "50%,45%"
    duration: 1800
- runFlow: ../common/pause.yaml
- runFlow: ../common/stop-recording.yaml
